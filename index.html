<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Охотминимум</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Полевой справочник егеря: бумага с лёгкой зеленью, мох, сигнальный оранжевый жилета */
:root{
  --bg:#F2F4EE; --paper:#FFFFFF; --ink:#1D2820; --muted:#5E6B61; --line:#D8DED3;
  --moss:#3D6A4C; --moss-soft:#E3EDE4; --blaze:#E0601A; --blaze-soft:#FCE8DB;
  --ok:#2E7D4A; --ok-soft:#DDF0E2; --bad:#B8322A; --bad-soft:#F8E0DD; --warn:#9A6B00; --warn-soft:#FBF0D2;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A16; --paper:#1C241F; --ink:#E6ECE5; --muted:#9AA79D; --line:#2E3A32;
  --moss:#7DB38E; --moss-soft:#24352A; --blaze:#F58A4B; --blaze-soft:#3A2618;
  --ok:#6CC58A; --ok-soft:#1E3526; --bad:#F07A6E; --bad-soft:#3D2220; --warn:#E3B54A; --warn-soft:#3A2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A16; --paper:#1C241F; --ink:#E6ECE5; --muted:#9AA79D; --line:#2E3A32;
  --moss:#7DB38E; --moss-soft:#24352A; --blaze:#F58A4B; --blaze-soft:#3A2618;
  --ok:#6CC58A; --ok-soft:#1E3526; --bad:#F07A6E; --bad-soft:#3D2220; --warn:#E3B54A; --warn-soft:#3A2F14; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blaze);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.top h1 b{color:var(--blaze)}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:15px}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* главная */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.ring{width:96px;height:96px}
.hero .nums{display:flex;flex-wrap:wrap;gap:6px 22px}
.hero .n{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mode:hover{border-color:var(--moss)}
.mode.primary{background:var(--blaze);border-color:var(--blaze);color:#fff}
.mode.primary small{color:#FFE9DC}
.mode b{display:block;font-size:17px}
.mode small{display:block;color:var(--muted);font-size:14px;line-height:1.3;margin-top:2px}
.mode svg{flex:none;width:30px;height:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec-h h2{font-size:22px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.topic{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.topic:hover{border-color:var(--moss)}
.topic .ic{width:44px;height:44px;border-radius:10px;background:var(--moss-soft);color:var(--moss);display:grid;place-items:center}
.topic .ic svg{width:28px;height:28px}
.topic b{display:block;font-size:15.5px;line-height:1.2}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .y{background:var(--warn)}
.topic small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
/* вопрос */
.qhead{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.qhead .prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qhead .prog i{display:block;height:100%;background:var(--blaze);transition:width .3s}
.qhead .cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qmeta .ic{width:40px;height:40px;border-radius:10px;background:var(--moss-soft);color:var(--moss);display:grid;place-items:center;flex:none}
.qmeta .ic svg{width:26px;height:26px}
.qmeta .num{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.25;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16.5px;line-height:1.35;min-width:0}
.opt .k{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.chosen{border-color:var(--moss);background:var(--moss-soft)}
.opt.chosen .k{background:var(--moss);border-color:var(--moss);color:#fff}
.verdict{margin-top:14px;border-radius:12px;padding:14px;display:grid;gap:8px}
.verdict.ok{background:var(--ok-soft)} .verdict.no{background:var(--bad-soft)}
.verdict h3{font-size:19px}
.verdict.ok h3{color:var(--ok)} .verdict.no h3{color:var(--bad)}
.verdict p{margin:0}
.why{font-size:16px}
.tip{border-left:3px solid var(--blaze);padding:4px 0 4px 10px;font-size:15px;color:var(--ink)}
.tip b{color:var(--blaze)}
.docnote{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14.5px}
.docnote b{color:var(--warn)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--moss);color:#fff}
.btn.blaze{background:var(--blaze)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.btn.wide{flex:1}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
/* результат */
.result{text-align:left}
.score{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.wrong-list{display:grid;gap:10px;margin-top:14px}
.wl{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wl .q{font-weight:700}
.wl .a{color:var(--ok);margin-top:4px}
.wl .y{color:var(--bad);margin-top:2px;font-size:15px}
.wl .e{color:var(--muted);font-size:14.5px;margin-top:4px}
/* шпаргалка */
.chart-box{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px}
.chart-box svg{display:block;min-width:720px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--muted);margin:8px 2px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.memo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.memo .m{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.memo .m h3{font-size:18px;margin-bottom:6px}
.memo .m p{margin:0 0 6px;font-size:15.5px}
.memo .m p:last-child{margin:0}
.dt{font-family:var(--f-mono);font-size:13.5px;background:var(--moss-soft);color:var(--moss);padding:1px 6px;border-radius:5px;white-space:nowrap}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 50px;position:relative}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--blaze);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.steps{padding:0;margin:0}
/* карточки */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center}
.flash .ans{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.flash .ans .a{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--ok)}
/* справочник */
.search{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14.5px}
.chip.on{background:var(--moss);border-color:var(--moss);color:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.toggle{width:52px;height:30px;border-radius:15px;border:none;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--moss)} .toggle.on::after{left:25px}
.danger{color:var(--bad);border-color:var(--bad)}
.acct{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 14px}
.acct img{width:40px;height:40px;border-radius:50%}
.acct .sp{flex:1}
.muted{color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis .n{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.tbl table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--moss-soft)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{height:6px;width:90px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:4px}.mini i{display:block;height:100%;background:var(--ok)}
.spk{width:70px;height:16px;display:block}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
@media (max-width:560px){
  body{font-size:16.5px}
  .modes,.topics,.memo{grid-template-columns:1fr}
  .qtext{font-size:20px}
  .hero{grid-template-columns:1fr}
  .ring{width:80px;height:80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<script>
// [№, тема, вопрос, [варианты], индекс верного, пояснение, примечание к документу]
const Q = [
[1,"general","К охоте приравнивается нахождение в охотничьих угодьях физических лиц с:",["только с охотничьим огнестрельным оружием","орудиями охоты и (или) продукцией охоты, собаками охотничьих пород, ловчими птицами","только с продукцией охоты"],1,"Достаточно любого признака: орудия охоты, продукция охоты, собаки охотничьих пород или ловчие птицы. Ружьё не обязательно — капкан или собака тоже делают прогулку охотой. Слово «только» в вариантах — почти всегда ловушка."],
[2,"general","Не приравнивается к охоте нахождение в охотничьих угодьях с охотничьим огнестрельным оружием:",["любых физических лиц","должностных лиц при осуществлении федерального государственного охотничьего контроля (надзора) и производственных охотничьих инспекторов при осуществлении производственного охотничьего контроля","охотников с действующими разрешениями"],1,"Исключение сделано только для инспекторов, которые находятся в угодьях по службе. Охотник с разрешением как раз и охотится."],
[3,"docs","При осуществлении охоты физическое лицо обязано иметь при себе:",["только охотничий билет","только разрешение на добычу охотничьих ресурсов","охотничий билет и разрешение на добычу охотничьих ресурсов, выданное в соответствии с установленным порядком"],2,"Базовая формула: БИЛЕТ + РАЗРЕШЕНИЕ. Билет — кто ты, разрешение — что и где можно добыть. Одно без другого не работает."],
[4,"docs","При осуществлении охоты в общедоступных охотничьих угодьях физическое лицо обязано иметь при себе:",["охотничий билет и разрешение на добычу охотничьих ресурсов, выданное в соответствии с установленным порядком","только охотничий билет","путевка и разрешение на добычу"],0,"В общедоступных угодьях путёвки нет вообще: путёвку выдаёт охотпользователь, а он есть только в закреплённых угодьях."],
[5,"docs","При осуществлении охоты в закрепленных охотничьих угодьях дополнительно к охотничьему билету и разрешению на добычу охотничьих ресурсов физическое лицо обязано иметь при себе:",["путевку","справку о прохождении медосмотра","страховой полис"],0,"Закреплённые угодья = есть хозяин (охотпользователь) = нужна его путёвка. Формула: билет + разрешение + путёвка."],
[6,"transport","Если в разрешении на добычу охотничьих ресурсов указана норма допустимой добычи более одной особи охотничьих животных в день, транспортировка продукции охоты осуществляется:",["при наличии разрешения на добычу охотничьих ресурсов без заполненных сведений о добыче таких охотничьих ресурсов и их количестве в нем","только после заполнения всех граф разрешения на добычу охотничьих ресурсов","только с письменного разрешения охотинспектора"],0,"Когда норма «больше одной особи в день» (утки, зайцы), заполнять бланк после каждого выстрела неудобно. Поэтому ВЕЗТИ можно по незаполненному разрешению. Двойники: вопросы 8 и 173."],
[7,"transport","Реализация продукции охоты производится при наличии:",["справки о качестве продукции","разрешения на добычу охотничьих ресурсов с заполненными сведениями о добыче таких охотничьих ресурсов и их количестве или заполненного отрывного талона к указанному разрешению на добычу охотничьих ресурсов","только товарного чека"],1,"ПРОДАТЬ можно только с ЗАПОЛНЕННЫМИ сведениями (или заполненным отрывным талоном). Сравни с перевозкой в вопросе 6: везти иногда можно и по пустому бланку, продавать — нет."],
[8,"transport","В разрешении на добычу охотничьих ресурсов не указано конкретное количество особей охотничьих животных. В этом случае транспортировка продукции охоты осуществляется:",["запрещена","при наличии разрешения на добычу охотничьих ресурсов без заполненных сведений о добыче таких охотничьих ресурсов и их количестве в нем","только в присутствии охотинспектора"],1,"Та же логика, что в вопросе 6: если точного количества нет, везти можно по разрешению без заполненных сведений."],
[9,"transport","Заполненный отрывной талон к разрешению на добычу охотничьих ресурсов используется для:",["учета добытых животных","транспортировки продукции охоты наравне с заполненным разрешением на добычу охотничьих ресурсов","получения новых разрешений на добычу охотничьих ресурсов"],1,"Отрывной талон — «пропуск» для туши. Его отделяют от разрешения сразу после добычи копытного и везут с продукцией."],

[155,"methods","При осуществлении охоты запрещается (выберите наиболее полный ответ):",["добыча кабанов загоном, нагоном, а также с применением собак охотничьих пород с 1 января по 28 (29) февраля, за исключением добора раненых кабанов","добыча кабанов загоном, нагоном, с 1 января по 28 (29) февраля, за исключением добора раненых кабанов","добыча кабанов загоном, нагоном, а также с применением собак охотничьих пород с 1 января по 28 (29) февраля"],0,"Самый полный: загон + нагон + собаки + исключение для добора раненых. Зимой кабана не гоняют — только с вышки (вопрос 236)."],

[161,"general","В зонах охраны охотничьих ресурсов на территории общедоступных охотничьих угодий высшее должностное лицо субъекта Российской Федерации:",["определяет порядок проведения биотехнических мероприятий","порядок выдачи разрешений на добычу охотничьих ресурсов","определяет сроки охоты, допустимые для использования орудия охоты и иные ограничения охоты"],2,"Губернатор в зонах охраны определяет сроки, орудия и другие ограничения."],
[162,"general","В зонах охраны охотничьих ресурсов на территории закреплённых охотничьих угодий охотпользователи вправе:",["вводить ограничения использования охотничьих ресурсов, включая запрет на их использование","определить порядок выдачи разрешений на добычу охотничьих ресурсов","определять нормы добычи охотничьих ресурсов"],0,"Хозяин угодий может ограничить или полностью запретить охоту в своей зоне охраны."],

[164,"safety","При осуществлении охоты запрещается:",["находится с расчехленным охотничьим оружием ближе 200 метров от жилого дома, жилого строения","осуществлять добычу охотничьих животных с применением охотничьего оружия ближе 200 метров от жилого дома, жилого строения","уничтожать выводковые норы и логовища волков, шакалов"],1,"Запрещено ДОБЫВАТЬ (стрелять) ближе 200 м от жилья. Просто находиться с расчехлённым ружьём — не нарушение по этому пункту."],

[168,"safety","При осуществлении охоты запрещается:",["стрелять по информационным знакам, в том числе дорожным знакам, знакам дорожного движения, межевым знакам, рекламным конструкциям (стендам, щитам), а также специальным информационным знакам (аншлагам) и иным информационным знакам и их опорам, жилым и нежилым помещениям","осуществлять добычу охотничьих животных с применением чучел и манков","уничтожать выводковые норы и логовища волков, шакалов"],0,"Стрельба по знакам, щитам, аншлагам и постройкам запрещена. Чучела и манки — законный способ."],

function pick(pos){
  const s=SES;if(s.picked!==null)return;const q=s.list[s.i];const k=s.order[pos];const ok=k===q.c;s.picked=pos;
  s.ans.push({id:q.id,k,ok});record(q.id,ok);
  const exam=s.kind==="exam";
  document.querySelectorAll(".opt").forEach((b,p)=>{b.disabled=true;const kk=s.order[p];

  const last=s.i===s.list.length-1;
  const nextBtn=`<div class="actions"><button class="btn blaze wide" data-next>${last?"Результат":"Дальше →"}</button></div>`;
  if(exam){document.getElementById("after").innerHTML=nextBtn}
  else document.getElementById("after").innerHTML=explainHTML(q,ok)+nextBtn;
  const nb=document.querySelector("[data-next]");if(nb)nb.focus({preventScroll:true});

}
function explainHTML(q,ok){

  ${ok?"":`<p><b>Правильно:</b> ${esc(q.o[q.c])}</p>`}

}
function next(){const s=SES;s.i++;if(s.i>=s.list.length)result();else{renderQ();scrollTo(0,0)}}
function result(){
  const s=SES;const ok=s.ans.filter(a=>a.ok).length,n=s.ans.length;

  const wr=s.ans.filter(a=>!a.ok);

  <div class="actions">${wr.length?`<button class="btn blaze" data-redo>Повторить ошибки этой сессии (${wr.length})</button>`:""}<button class="btn ghost" data-go="home">На главную</button></div></div>`;

  app.innerHTML=h;SES.wrongIds=wr.map(a=>a.id);scrollTo(0,0);
}

function chart(){
  const LW=260,RW=150,W=1140,RH=22,top=34;let y=top;const rows=[];

  const H=y+8,PX=(W-LW-RW)/365;
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Календарь сроков охоты, с июля по июнь" font-family="Alegreya Sans,Segoe UI,sans-serif">`;
  for(let i=0;i<12;i++){const m=(6+i)%12+1;const x=LW+off(m,1)*PX;g+=`<line x1="${x}" y1="${top-6}" x2="${x}" y2="${H}" stroke="var(--line)" stroke-width="1"/><text x="${x+MD[m-1]*PX/2}" y="${top-12}" text-anchor="middle" font-size="13" fill="var(--muted)">${MN[m-1]}</text>`}
  rows.forEach(({r,y})=>{
    if(!r[1]){g+=`<text x="4" y="${y+19}" font-size="15" font-weight="700" fill="var(--ink)" font-family="Alegreya,Georgia,serif">${r[0]}</text>`;return}
    g+=`<text x="4" y="${y+15}" font-size="12.5" fill="var(--ink)">${r[0]}</text>`;
    r[1].forEach(([m1,d1,m2,d2])=>{const a=off(m1,d1),b=off(m2,d2);const tip=`${r[0]}: ${fmt(m1,d1)} – ${fmt(m2,d2)}`;
      const seg=(s,e)=>`<rect x="${LW+s*PX}" y="${y+4}" width="${Math.max(2,(e-s+1)*PX)}" height="${RH-8}" rx="4" fill="${COL[r[2]]}"><title>${tip}</title></rect>`;
      if(b>=a)g+=seg(a,b);else{g+=seg(a,364)+seg(0,b)}
    });
    const txt=r[1].map(([m1,d1,m2,d2])=>`${d1}.${String(m1).padStart(2,"0")}–${d2}.${String(m2).padStart(2,"0")}`).join(" и ");
    g+=`<text x="${W-4}" y="${y+15}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${txt}</text>`;
  });
  return g+`</svg>`;
}

const ORD=QS.map(q=>q.id);
const SITE="https://mbscnsk.github.io/Ohotminimum/";
function exportCode(){let s="";ORD.forEach(id=>{const x=S.st[id];if(!x||!x.s){s+="---";return}s+=(x.b*2+(x.m?1:0)).toString(36)+Math.min(35,x.w).toString(36)+Math.min(35,x.s).toString(36)});return "1"+s.replace(/(---)+$/,"")}
function parseCode(c){c=(c||"").trim();if(c.includes("sync="))c=c.split("sync=")[1];try{c=decodeURIComponent(c)}catch(e){}c=c.trim();if(c[0]!=="1")return null;c=c.slice(1);if(c.length%3)return null;const out={};for(let i=0;i*3<c.length;i++){const ch=c.substr(i*3,3);if(ch==="---")continue;const v=parseInt(ch[0],36),w=parseInt(ch[1],36),s=parseInt(ch[2],36);if([v,w,s].some(isNaN)||!ORD[i])return null;out[ORD[i]]={b:Math.min(5,v>>1),m:v&1,w,s}}return out}
function mergeCode(data){let n=0;Object.keys(data).forEach(id=>{const cur=S.st[id],x=data[id];if(cur&&cur.s>=x.s)return;S.st[id]=Object.assign({t:Date.now()},x);n++});save();return n}
function syncLink(){return SITE+"#sync="+exportCode()}
let SYNCMSG="";
function syncView(){
  const a=stats(QS);
  app.innerHTML=top("Перенос прогресса",1)+`<div class="card"><h2 style="font-size:20px;margin-bottom:6px">С этого устройства</h2>
  <p class="sub" style="margin:0 0 10px">Здесь пройдено ${a.s} вопр., выучено ${a.l}. Скопируй ссылку, отправь себе в Telegram или на почту и открой её на другом устройстве.</p>
  <textarea id="sl" class="search" rows="3" readonly style="font-family:var(--f-mono);font-size:12px;resize:none">${esc(syncLink())}</textarea>
  <div class="actions"><button class="btn blaze" id="cp">Скопировать ссылку</button></div></div>
  <div class="card" style="margin-top:12px"><h2 style="font-size:20px;margin-bottom:6px">На это устройство</h2>
  <p class="sub" style="margin:0 0 10px">Открой ссылку с другого устройства или вставь её сюда. Прогресс объединится: по каждому вопросу останется запись, где он пройден больше раз.</p>
  <textarea id="si" class="search" rows="3" placeholder="Вставь ссылку или код" style="font-family:var(--f-mono);font-size:12px;resize:vertical"></textarea>
  <div class="actions"><button class="btn" id="ld">Загрузить прогресс</button></div>
  ${SYNCMSG?`<p class="docnote" style="margin-top:10px">${SYNCMSG}</p>`:""}</div>`;
  SYNCMSG="";
}
function syncIncoming(){
  const h=location.hash;if(!h.includes("sync="))return false;
  const data=parseCode(h);
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  if(!data){SYNCMSG="Ссылка повреждена. Скопируй её заново целиком.";syncView();return true}
  const n=Object.keys(data).length;
  app.innerHTML=top("Перенос прогресса",1)+`<div class="card"><h2 style="font-size:20px">Загрузить прогресс с другого устройства?</h2><p>В ссылке ${n} пройденных вопросов. Они объединятся с тем, что уже есть на этом устройстве, ничего не потеряется.</p><div class="actions"><button class="btn blaze" id="inc">Загрузить</button><button class="btn ghost" data-go="home">Отмена</button></div></div>`;
  document.getElementById("inc").onclick=()=>{const k=mergeCode(data);SYNCMSG=`Готово. Обновлено вопросов: ${k}.`;syncView()};
  return true;
}

const ADMINS=["mobsce@gmail.com"];
let USER=null,DB=null,PUSH_T=null,CLOUD_STATE="off",CLOUD_ERR="",CUR="home";

function accountBar(){

function cloudMsg(){if(CLOUD_STATE==="ok")return"сохранено в облаке";if(CLOUD_STATE==="sync")return"синхронизация…";if(CLOUD_STATE==="err")return CLOUD_ERR==="permission-denied"?"облако не принимает данные: проверь правила Firestore":CLOUD_ERR?"не сохранилось ("+CLOUD_ERR+"), повторю позже":"нет связи, сохранится позже";return""}
function rerender(){if(SES||FL&&CUR==="flash")return;if(CUR==="home")home();else if(CUR==="settings")settings();}
function mergeRemote(r){
  if(!r)return;
  const rs=r.st||{};Object.keys(rs).forEach(id=>{const cur=S.st[id],x=rs[id];if(!x||!BYID[id])return;if(!cur||(x.s||0)>(cur.s||0))S.st[id]=x});
  const seen={};S.exams=(S.exams||[]).concat(r.exams||[]).filter(e=>{if(!e||seen[e.d])return false;seen[e.d]=1;return true}).sort((a,b)=>a.d-b.d).slice(-30);
  S.act=S.act||{};Object.keys(r.act||{}).forEach(k=>{S.act[k]=Math.max(S.act[k]||0,r.act[k])});
  save();
}
async function pull(){
  if(!USER||!DB)return;CLOUD_STATE="sync";
  try{const d=await DB.collection("users").doc(USER.uid).get();if(d.exists)mergeRemote(d.data());await push(true)}catch(e){CLOUD_STATE="err";CLOUD_ERR=e.code||e.message||"";console.warn(e)}
}
function schedulePush(){if(!USER||!DB)return;clearTimeout(PUSH_T);PUSH_T=setTimeout(()=>push(),2500)}
async function push(){
  if(!USER||!DB)return;clearTimeout(PUSH_T);
  const a=stats(QS);
  try{
    await DB.collection("users").doc(USER.uid).set({
      name:USER.displayName||"",email:USER.email||"",photo:USER.photoURL||"",
      st:S.st,exams:S.exams||[],act:S.act||{},
      learned:a.l,seen:a.s,mistakes:a.m,
      updated:firebase.firestore.FieldValue.serverTimestamp()
    });
    CLOUD_STATE="ok";CLOUD_ERR="";
  }catch(e){CLOUD_STATE="err";CLOUD_ERR=e.code||e.message||"";console.warn(e)}
  const m=document.querySelector(".acct .muted");if(m&&USER)m.textContent=cloudMsg();
}
function cloudInit(){
  if(!cloudOn())return;
  try{firebase.initializeApp(FB_CONFIG);DB=firebase.firestore();}catch(e){console.warn(e);return}
  firebase.auth().getRedirectResult().catch(()=>{});
  firebase.auth().onAuthStateChanged(async u=>{
    if(u&&S.uid&&S.uid!==u.uid){S.st={};S.exams=[];S.act={}}
    if(u){S.uid=u.uid;save()}
    USER=u;CLOUD_STATE=u?"sync":"off";rerender();if(u){await pull();rerender()}});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&PUSH_T)push()});
}
function login(){
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  firebase.auth().signInWithPopup(p).catch(e=>{
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code))return firebase.auth().signInWithRedirect(p);
    if(e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request")return;
    alertBox("Не получилось войти: "+(e.message||e.code));
  });
}
function alertBox(t){const b=document.createElement("p");b.className="docnote";b.textContent=t;const a=document.querySelector(".acct");if(a)a.after(b);else app.prepend(b)}

/* ---------- статистика для организатора ---------- */
function fmtAgo(d){if(!d)return"—";const m=(Date.now()-d)/6e4;if(m<2)return"только что";if(m<60)return Math.round(m)+" мин назад";const h=m/60;if(h<24)return Math.round(h)+" ч назад";const dd=Math.round(h/24);return dd===1?"вчера":dd+" дн. назад"}
function sumDays(act,n){let s=0;for(let i=0;i<n;i++){const d=new Date(Date.now()-i*864e5);s+=act&&act[dayKey(d)]||0}return s}
function spark(act){let h='<svg class="spk" viewBox="0 0 70 16" aria-hidden="true">';let mx=1;const v=[];for(let i=13;i>=0;i--){const x=act&&act[dayKey(new Date(Date.now()-i*864e5))]||0;v.push(x);mx=Math.max(mx,x)}v.forEach((x,i)=>{const hh=x?Math.max(2,x/mx*14):1;h+=`<rect x="${i*5}" y="${16-hh}" width="4" height="${hh}" rx="1" fill="${x?"var(--moss)":"var(--line)"}"/>`});return h+"</svg>"}
let ADM=null;
async function admin(){
  CUR="admin";
  app.innerHTML=top("Статистика",1)+`<p class="sub">Загружаю данные…</p>`;
  if(!isAdmin()){app.innerHTML=top("Статистика",1)+`<div class="card"><p>Эта страница доступна только организатору.</p></div>`;return}
  try{const snap=await DB.collection("users").get();ADM=snap.docs.map(d=>{const x=d.data();x.id=d.id;x.upd=x.updated&&x.updated.toDate?x.updated.toDate().getTime():0;return x})}
  catch(e){app.innerHTML=top("Статистика",1)+`<div class="card"><p>Не удалось загрузить: ${esc(e.message||e.code)}</p><p class="sub">Проверь, что в Firestore вставлены правила доступа.</p></div>`;return}
  adminRender();
}
function adminRender(){
  const U=ADM.slice().sort((a,b)=>b.upd-a.upd);
  const act7=U.filter(u=>sumDays(u.act,7)>0).length;
  const ready=U.filter(u=>(u.learned||0)>=230).length;
  const qa={};U.forEach(u=>Object.keys(u.st||{}).forEach(id=>{const x=u.st[id];if(!x||!x.s)return;const z=qa[id]||(qa[id]={s:0,w:0,p:0});z.s+=x.s;z.w+=x.w||0;z.p++}));
  const hard=Object.keys(qa).filter(id=>BYID[id]&&qa[id].s>=3).map(id=>[id,qa[id].w/qa[id].s]).sort((a,b)=>b[1]-a[1]).slice(0,15);
  let h=top("Статистика",1)+`<div class="kpis">
   <div class="card"><div class="label">Участников</div><div class="n">${U.length}</div></div>
   <div class="card"><div class="label">Занимались за 7 дней</div><div class="n">${act7}</div></div>
   <div class="card"><div class="label">Почти готовы (230+)</div><div class="n">${ready}</div></div></div>
   <div class="sec-h"><h2>Люди</h2><button class="iconbtn" data-go="admin">Обновить</button></div>
   <div class="tbl"><table><thead><tr><th>Кто</th><th>Выучено</th><th>Ошибки</th><th>Ответов за 7 дн.</th><th>14 дней</th><th>Экзамены</th><th>Был</th></tr></thead><tbody>`;
  U.forEach(u=>{const ex=u.exams||[];const le=ex[ex.length-1];const best=ex.filter(e=>e.n>=20).reduce((m,e)=>Math.max(m,e.ok/e.n),0);
    const l=u.learned||0;
    h+=`<tr data-user="${esc(u.id)}"><td><b>${esc(u.name||"Без имени")}</b><div class="muted">${esc(u.email||"")}</div></td>
      <td><div class="mini"><i style="width:${l/QS.length*100}%"></i></div><span class="num">${l} / ${QS.length}</span></td>
      <td class="num">${u.mistakes||0}</td><td class="num">${sumDays(u.act,7)}</td><td>${spark(u.act)}</td>
      <td class="num">${ex.length?`${ex.length} · посл. ${le.ok}/${le.n}${best?` · лучш. ${Math.round(best*100)}%`:""}`:"—"}</td>
      <td class="num">${fmtAgo(u.upd)}</td></tr>`});
  h+=`</tbody></table></div>${U.length?"":`<p class="sub">Пока никто не вошёл. Когда люди войдут через Google на сайте, они появятся здесь.</p>`}
   <p class="sub">«Выучено» — вопрос отвечен верно 3 раза подряд. Нажми на человека, чтобы увидеть прогресс по темам.</p>
   <div id="udet"></div>
   <div class="sec-h"><h2>Самые трудные вопросы</h2><span class="label">доля ошибок по всем</span></div>
   <div class="wrong-list">${hard.length?hard.map(([id,r])=>{const q=BYID[id];return `<div class="wl"><div class="label">Вопрос ${id} · ${TOP[q.t].n} · ошибок ${Math.round(r*100)}% · ответили ${qa[id].p} чел.</div><div class="q">${esc(q.q)}</div><div class="a">✓ ${esc(q.o[q.c])}</div></div>`}).join(""):`<p class="sub">Пока мало ответов для статистики.</p>`}</div>`;
  app.innerHTML=h;
}
function userDetail(uid){
  const u=ADM.find(x=>x.id===uid);if(!u)return;
  const box=document.getElementById("udet");
  box.innerHTML=`<div class="card" style="margin-top:12px"><div class="sec-h" style="margin:0 0 10px"><h2>${esc(u.name||u.email)}</h2><span class="label">по темам</span></div><div class="topics">`+ORDER.map(k=>{const list=QS.filter(q=>q.t===k);let l=0,s=0;list.forEach(q=>{const x=(u.st||{})[q.id];if(x&&x.s)s++;if(x&&x.b>=3)l++});
   return `<div class="topic" style="cursor:default"><span class="ic">${ICON[TOP[k].i]}</span><span><b>${TOP[k].n}</b><small>${l} из ${list.length} выучено</small><span class="bar"><i class="g" style="width:${l/list.length*100}%"></i><i class="y" style="width:${(s-l)/list.length*100}%"></i></span></span></div>`}).join("")+`</div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- маршрутизация ---------- */
function go(v){SES=null;FL=null;CUR=v;scrollTo(0,0);
  if(v==="home")home();
  else if(v==="smart")start("smart",pickSmart(15),"Умная тренировка");
  else if(v==="exam")examSetup();
  else if(v==="mist")start("mist",shuffle(QS.filter(q=>inMist(q.id))),"Работа над ошибками");
  else if(v==="flash")flashStart();
  else if(v==="cheat")cheat();
  else if(v==="ref")ref();
  else if(v==="settings"){resetArm=false;settings()}
  else if(v==="sync")syncView();
  else if(v==="admin")admin();
}
app.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-user]");if(tr)return userDetail(tr.dataset.user);
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.go)return go(t.dataset.go);
  if(t.hasAttribute("data-login"))return login();
  if(t.hasAttribute("data-logout")){const done=()=>{S.st={};S.exams=[];S.act={};S.uid=null;save();firebase.auth().signOut()};if(PUSH_T)push().then(done);else done();return}
  if(t.dataset.topic){const k=t.dataset.topic;return start("topic",pickSmart(20,QS.filter(q=>q.t===k)),TOP[k].n)}
  if(t.dataset.pick!==undefined)return pick(+t.dataset.pick);
  if(t.hasAttribute("data-next"))return next();
  if(t.hasAttribute("data-redo")){const ids=SES.wrongIds;return start("redo",shuffle(ids.map(i=>BYID[i])),"Повтор ошибок")}
  if(t.dataset.exam)return start("exam",shuffle(QS).slice(0,+t.dataset.exam),"Экзамен");
  if(t.hasAttribute("data-flopen")){FL.open=true;return flashR()}
  if(t.dataset.fl!==undefined){record(FL.list[FL.i].id,t.dataset.fl==="1");FL.i++;FL.open=false;if(FL.i>=FL.list.length){app.innerHTML=top("Карточки",1)+`<div class="card"><h2>Колода пройдена</h2><p>Отметки «Знал / Не вспомнил» учтены в общей статистике.</p><div class="actions"><button class="btn blaze" data-go="flash">Ещё 20 карточек</button><button class="btn ghost" data-go="home">На главную</button></div></div>`}else flashR();return}
  if(t.dataset.rt!==undefined){REF.t=t.dataset.rt;return ref()}
  if(t.hasAttribute("data-notes"))return start("notes",["91","99","104","117","118","118-2","257"].map(i=>BYID[i]),"Вопросы с опечатками");
  if(t.id==="cp"){const ta=document.getElementById("sl");const done=()=>{t.textContent="Скопировано"};try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();done()})}catch(err){ta.select();document.execCommand&&document.execCommand("copy");done()}return}
  if(t.id==="ld"){const data=parseCode(document.getElementById("si").value);if(!data){SYNCMSG="Не получилось прочитать. Вставь ссылку целиком, от https до конца.";return syncView()}const k=mergeCode(data);SYNCMSG=`Готово. Обновлено вопросов: ${k}.`;return syncView()}
  if(t.id==="tg-sh"){S.opt.shuffle=!S.opt.shuffle;save();return settings()}
  if(t.id==="rst"){if(!resetArm){resetArm=true;return settings()}S.st={};S.exams=[];save();resetArm=false;return go("home")}
});
document.addEventListener("keydown",e=>{
  if(!SES||e.target.tagName==="INPUT")return;
  if(["1","2","3","4"].includes(e.key)&&SES.picked===null){const p=+e.key-1;if(p<SES.list[SES.i].o.length){e.preventDefault();pick(p)}}
  else if((e.key==="Enter"||e.key===" ")&&SES.picked!==null&&document.activeElement?.dataset?.next===undefined){e.preventDefault();next()}
});
if(!syncIncoming())home();
cloudInit();
})();
